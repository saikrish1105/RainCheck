<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        width: 260px; margin: 0; padding: 16px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        background: #141519; color: #e7e7e7; font-size: 13px;
      }
      .head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
      .logo {
        width: 32px; height: 32px; border-radius: 8px; font-size: 17px;
        display: flex; align-items: center; justify-content: center;
        background: linear-gradient(135deg, #2f6feb, #b146c2);
      }
      h1 { font-size: 16px; margin: 0; }
      p { color: #9aa0ab; line-height: 1.5; margin: 0 0 12px; }
      ul { margin: 0 0 12px; padding-left: 18px; color: #c9cdd6; line-height: 1.6; }
      button {
        width: 100%; background: #2f6feb; color: #fff; border: none; border-radius: 8px;
        padding: 9px; font-size: 13px; font-weight: 600; cursor: pointer;
      }
      button:hover { background: #3b7bff; }
      a { color: #8ab4ff; text-decoration: none; }
    </style>
  </head>
  <body>
    <div class="head">
      <div class="logo">🌧</div>
      <h1>RainCheck</h1>
    </div>
    <p>Recovers your work when a Claude.ai session is interrupted by a rate limit.</p>
    <ul>
      <li>Download hidden / partial artifacts</li>
      <li>Get a structured handoff report</li>
      <li>Resume on a fresh session</li>
    </ul>
    <p>Open a chat on <b>claude.ai</b>, send a message, and the floating panel will capture everything.</p>
    <button id="options">Open settings</button>
    <script>
      document.getElementById('options').addEventListener('click', () => {
        chrome.runtime.openOptionsPage();
      });
    </script>
  </body>
</html>
